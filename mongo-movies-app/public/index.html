<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MongoDB Movies Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .hidden { display: none !important; }

    /* Login */
    .login-card {
      max-width: 450px; margin: 80px auto; background: #1e293b; padding: 30px;
      border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .login-card h2 { margin-bottom: 20px; text-align: center; color: #38bdf8; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; }
    .form-group input {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155;
      background: #0f172a; color: #fff; outline: none;
    }
    button {
      width: 100%; padding: 12px; background: #0284c7; color: #fff;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #0369a1; }
    .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 10px; text-align: center; }

    /* Grid */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .movie-card {
      background: #1e293b; border-radius: 8px; overflow: hidden; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .movie-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .movie-card img { width: 100%; height: 300px; object-fit: cover; background-color: #334155; }
    .movie-card-info { padding: 15px; }
    .movie-card-info h4 { font-size: 1rem; margin-bottom: 5px; }
    .movie-card-info span { font-size: 0.85rem; color: #94a3b8; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #1e293b; width: 90%; max-width: 750px; max-height: 85vh;
      border-radius: 12px; overflow-y: auto; padding: 25px; position: relative;
    }
    .close-btn {
      position: absolute; top: 15px; right: 20px; font-size: 1.5rem;
      background: none; border: none; color: #94a3b8; cursor: pointer; width: auto;
    }
    .modal-body { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
    .modal-body img { width: 220px; height: 320px; object-fit: cover; border-radius: 8px; }
    .modal-details { flex: 1; min-width: 250px; }
    .modal-details p { margin-bottom: 10px; font-size: 0.95rem; line-height: 1.4; }
    .badge { display: inline-block; background: #0284c7; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. LOGIN -->
    <div id="loginView" class="login-card">
      <h2>Conectar a MongoDB</h2>
      <div class="form-group">
        <label>URI de Conexión (Connection String):</label>
        <input type="password" id="mongoUri" placeholder="mongodb+srv://usuario:password@cluster.mongodb.net/">
      </div>
      <div class="form-group">
        <label>Base de Datos:</label>
        <input type="text" id="dbName" value="sample_mflix" placeholder="sample_mflix">
      </div>
      <button id="btnLogin" onclick="login()">Conectar y Explorar</button>
      <div id="loginError" class="error-msg"></div>
    </div>

    <!-- 2. CATÁLOGO -->
    <div id="moviesView" class="hidden">
      <div class="header">
        <h2>Catálogo de Películas</h2>
        <button style="width: auto; padding: 8px 16px; background: #dc2626;" onclick="location.reload()">Desconectar</button>
      </div>
      <div id="moviesGrid" class="movies-grid"></div>
    </div>
  </div>

  <!-- 3. MODAL DETALLE -->
  <div id="movieModal" class="modal-overlay hidden" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    async function login() {
      const uri = document.getElementById('mongoUri').value;
      const dbName = document.getElementById('dbName').value;
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');

      errorDiv.innerText = '';
      btn.innerText = 'Conectando...';

      try {
        const res = await fetch('/api/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uri, dbName })
        });

        const data = await res.json();
        if (res.ok) {
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('moviesView').classList.remove('hidden');
          loadMovies();
        } else {
          errorDiv.innerText = data.message || 'Error de conexión';
        }
      } catch (err) {
        errorDiv.innerText = 'No se pudo comunicar con el servidor local.';
      } finally {
        btn.innerText = 'Conectar y Explorar';
      }
    }

    async function loadMovies() {
      const res = await fetch('/api/movies');
      const movies = await res.json();
      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = '';

      movies.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = () => openMovieDetail(m._id);
        const posterSrc = m.poster || 'https://via.placeholder.com/300x450?text=Sin+Poster';

        card.innerHTML = `
          <img src="${posterSrc}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/300x450?text=Sin+Poster'">
          <div class="movie-card-info">
            <h4>${m.title}</h4>
            <span>Año: ${m.year || 'N/A'}</span><br>
            <span>⭐ ${m.imdb?.rating || 'N/A'}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function openMovieDetail(id) {
      const res = await fetch('/api/movies/' + id);
      const m = await res.json();

      const modalBody = document.getElementById('modalBody');
      const posterSrc = m.poster || 'https://via.placeholder.com/300x450?text=Sin+Poster';
      const badges = (m.genres || []).map(g => `<span class="badge">${g}</span>`).join(' ');

      modalBody.innerHTML = `
        <h2 style="color: #38bdf8; margin-bottom: 15px;">${m.title} (${m.year || 'N/A'})</h2>
        <div class="modal-body">
          <img src="${posterSrc}" onerror="this.src='https://via.placeholder.com/300x450?text=Sin+Poster'">
          <div class="modal-details">
            <p><strong>Géneros:</strong><br>${badges || 'N/A'}</p>
            <p><strong>Sinopsis:</strong> ${m.fullplot || m.plot || 'Sin descripción disponible.'}</p>
            <p><strong>Directores:</strong> ${m.directors ? m.directors.join(', ') : 'N/A'}</p>
            <p><strong>Elenco:</strong> ${m.cast ? m.cast.join(', ') : 'N/A'}</p>
            <p><strong>Duración:</strong> ${m.runtime ? m.runtime + ' min' : 'N/A'}</p>
            <p><strong>Calificación IMDB:</strong> ⭐ ${m.imdb?.rating || 'N/A'} (${m.imdb?.votes || 0} votos)</p>
          </div>
        </div>
      `;
      document.getElementById('movieModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('movieModal').classList.add('hidden');
    }
  </script>
</body>
</html>
